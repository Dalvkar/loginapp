services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: login_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - login_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d login_app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  login_app_data:
